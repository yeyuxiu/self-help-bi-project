name: Deploy React App to GitHub Pages

# 1. 触发条件：当代码推送到 main 分支时触发
on:
  push:
    branches: ["master"]
  # 允许手动触发
  workflow_dispatch:

# 2. 任务定义
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 环境

    steps:
      # --- 步骤 A：拉取代码 ---
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --- 步骤 B：安装 Node.js 环境 ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 根据你的项目需求选择版本，如 18 或 20

      # --- 步骤 C：安装依赖 ---
      - name: Install Dependencies
        run: npm install

      # --- 步骤 D：执行构建 (生成 dist 或 build 文件夹) ---
      - name: Build Project
        run: npm run build
        # 注意：如果你的打包命令是 build:prod 或者其他，请修改这里

      # --- 步骤 E：部署到 GitHub Pages ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 这里根据你的实际打包输出目录填写，通常是 dist 或 build
          publish_dir: ./dist 